name: Claude Auto Review

# Automatic standalone PR review by Claude: does its own correctness/security/reuse
# review, applies MATERIAL fixes, runs the repo's verify, and pushes to the PR branch.
# Runs on PR open and on every new push (synchronize).
#
# REQUIRES repo secret `CLAUDE_CODE_OAUTH_TOKEN` — generate locally with
# `claude setup-token` (Claude Pro/Max subscription; no API key needed).
# Until it's set, this workflow is a no-op (green) — see the `guard` step.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop, main]

permissions:
  contents: write        # push fixes to the PR branch
  pull-requests: write   # post the review
  issues: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Run on PR open/push, EXCEPT when the push came from our own bots — the
    # auto-review pushes fixes with GITHUB_TOKEN, and reviewing its own commit is
    # both recursive and rejected by the action's non-human-actor guard.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — skipping Claude auto-review."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: steps.guard.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the built-in Actions token so the action skips the OIDC / Claude
          # GitHub App flow (which would need `id-token: write` + the app installed).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --max-turns 30
            --allowed-tools "Read,Edit,Write,Glob,Grep,Bash"
          prompt: |
            You are the automated reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            1. Read the existing feedback on this PR so you don't repeat points already made:
               `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json comments,reviews`
               and `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            2. Review the PR diff yourself for correctness, security, and reuse/simplification. Report only issues you're confident are real.
            3. Fix only issues that affect correctness, security, or the PR's stated requirements, each with the smallest change that resolves it. Leave style and unrelated code as they are — the author has to re-review every commit you push.
            4. If you changed code: run the repo's verify command(s) from CLAUDE.md and make them pass (fix root causes; never weaken tests). Then commit with a conventional message and push to the PR branch.
            5. If nothing needs fixing — including when earlier runs already handled the actionable feedback — don't push.
            6. Post a single consolidated review comment: what you fixed (and the commit), and anything the author should double-check; if there was nothing new, say so in a line. Be concise.
