openapi: 3.0.3
info:
  title: MysteryBox API
  description: |
    MysteryBox is a food waste reduction platform that connects users with discounted mystery boxes of near-expiry food from local merchants.

    ## Authentication
    - **User endpoints**: Require authentication via `/api/user/line/verify-token` (LINE), `/api/user/apple/verify-token` (Apple) or `/api/user/google/verify-token` (Google)
    - **Merchant endpoints**: Require email/password login via `/api/merchant/login`

    Both authentication flows return JWT tokens to use in the Authorization header as `Bearer <token>`.
  version: 1.0.0
  contact:
    name: MysteryBox Team

servers:
  # Relative URL — Swagger UI sends "Try it out" requests to the same origin that
  # serves this page (localhost or the dev Cloud Run host). Same-origin means no CORS,
  # which is why this must be the default. Swagger is only enabled in development, so
  # the page is never served from production; selecting an absolute cross-origin server
  # below would be blocked by that server's CORS policy ("Failed to fetch").
  - url: /
    description: Current host (default — use this for "Try it out")
  - url: http://localhost:8080
    description: Local development server
  - url: https://freshtogo-api-dev-405969899534.asia-east1.run.app
    description: Dev server (Cloud Run)
  - url: https://freshtogo-api-405969899534.asia-east1.run.app
    description: Production server (Cloud Run)

tags:
  - name: Boxes
    description: Mystery box browsing
  - name: User
    description: User authentication and profile
  - name: Notifications
    description: Push notification token management
  - name: Reservations
    description: User reservation management
  - name: Follows
    description: Follow / unfollow stores and get following list
  - name: Skipped Boxes
    description: Hunt mode's skip list - boxes the consumer has passed on
  - name: Recommendations
    description: Community store recommendations and voting (Ambassador Program)
  - name: Feedback
    description: 給鮮款款的話 - a consumer's private message to the FreshToGo team
  - name: Food Log
    description: 我的食記 - the consumer's private log of picked-up orders (photo + note per order)
  - name: Places
    description: Server-side Google Places proxy (the Google API key never reaches the client)
  - name: Merchant
    description: Merchant authentication and management
  - name: Merchant Orders
    description: Order management for merchants
  - name: Stats
    description: Public platform statistics
  - name: Events
    description: Event tracking and analytics
  - name: Admin Events
    description: Admin event analytics (stats, funnels)
  - name: Merchant Events
    description: Merchant-scoped event analytics
  - name: Admin Auth
    description: Admin authentication and session
  - name: Admin Merchants
    description: Admin merchant management
  - name: Admin Users
    description: Admin consumer-account management
  - name: Admin Feedback
    description: Admin inbox for consumer feedback (the only place feedback is readable)
  - name: Admin Food Log
    description: Admin view and moderation of a user's 我的食記 entries
  - name: Admin Boxes
    description: Admin listing oversight across all merchants
  - name: Admin Reservations
    description: Admin reservation oversight and manual intervention
  - name: Admin Analytics
    description: Admin dashboard totals and daily time series
  - name: Admin Notifications
    description: Admin push broadcasts
  - name: Admin
    description: Admin box-template management on behalf of a merchant
  - name: Admin Settings
    description: Admin runtime settings
  - name: Admin App
    description: Admin control of the client forced-update floor
  - name: App
    description: Public client bootstrap (version gate)
  - name: Internal
    description: Cloud Scheduler jobs, gated by the X-Internal-Api-Key header
  - name: Admin Stock Photos
    description: Admin curated stock-photo library management (Feature A)
  - name: Ops
    description: Operational endpoints (health probe)

components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/user/line/verify-token, /api/user/apple/verify-token or /api/user/google/verify-token
    merchantAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/merchant/login
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/admin/login
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Secret key for Cloud Scheduler / internal service endpoints

  parameters:
    ScheduledTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduledSaleDate:
      name: saleDate
      in: path
      required: true
      description: Merchant-local date of the scheduled day.
      schema:
        type: string
        format: date

  schemas:
    ProductCategory:
      type: string
      enum:
        - BAKERY
        - DELI
        - PRODUCE
        - BEVERAGE
        - DESSERT
        - GROCERY
        - FROZEN
        - GENERAL
      description: |
        Fixed 8-value product category, used by the stock-photo library and box listings. The wire
        value is a stable ASCII code, NOT the Chinese display string (the label is a client concern).
        Code -> label: BAKERY=烘焙麵包, DELI=便當・熟食, PRODUCE=生鮮蔬果, BEVERAGE=飲料・咖啡,
        DESSERT=甜點・蛋糕, GROCERY=雜貨零食, FROZEN=冷凍・即食, GENERAL=綜合 (catch-all & default).

    PurchaseEligibilityType:
      type: string
      enum:
        - UNRESTRICTED
        - FIRST_TIME_AT_STORE
        - ONCE_PER_TEMPLATE
        - RETURNING_CUSTOMER
      description: |
        Who a listing is open to. Exactly one value per box or template. Filtering is server-side: a
        listing the caller is not eligible for is absent from the response, never returned disabled.

        - UNRESTRICTED         anyone. The default, and what an omitted or unknown value means.
        - FIRST_TIME_AT_STORE  only a caller with NO live order at this merchant. Live = neither
                               cancelled nor recorded as a no-show; a COLLECTED order still counts.
        - ONCE_PER_TEMPLATE    only a caller with no live order from this box's `boxTemplateId`, so the
                               same template run on consecutive days is one entitlement, not one per day.
        - RETURNING_CUSTOMER   only a caller with at least `eligibilityThreshold` COLLECTED orders at
                               this merchant. Note this counts completed pickups where the rules above
                               count live orders.

        An unauthenticated caller is eligible for UNRESTRICTED listings only.

    EligibleAudienceResponse:
      type: object
      description: >
        How many people a listing would be open to under one eligibility condition. The three request
        values are echoed back so a client firing this on every change to the eligibility picker can
        match an answer to the current form state and discard a stale one.
      required:
        - merchantId
        - eligibilityType
        - eligibleUserCount
        - addressableUserCount
      properties:
        merchantId:
          type: string
          format: uuid
          description: The store the count was measured at. On the merchant path, always the caller's own.
        eligibilityType:
          $ref: '#/components/schemas/PurchaseEligibilityType'
        eligibilityThreshold:
          type: integer
          nullable: true
          description: >
            The N of `RETURNING_CUSTOMER(N)`. Null/absent for every other type, exactly as a box stores
            it — a threshold sent with a type that does not read one is dropped, not rejected.
        boxTemplateId:
          type: string
          format: uuid
          nullable: true
          description: >
            The provenance scope the count was measured in, echoed as supplied. Only ONCE_PER_TEMPLATE
            reads it.
        eligibleUserCount:
          type: integer
          description: >
            How many addressable consumers satisfy the condition right now. Uncached: it reads committed
            state at the moment of the call.
        addressableUserCount:
          type: integer
          description: >
            How many consumers could buy *anything* right now — every account that is not blocked. The
            denominator, so a client can say "3 of 240" rather than a bare number. UNRESTRICTED returns
            this same value as `eligibleUserCount`.

    StockPhotoStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED
      description: |
        Lifecycle of a stock photo. DISABLED photos are excluded from the merchant-facing by-category
        selection list but remain visible to admins.

    StockPhotoResponse:
      type: object
      description: Admin-facing view of a stock photo, including status and (optional) usage stats.
      required:
        - id
        - imageUrl
        - category
        - status
        - sortOrder
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategory'
        status:
          $ref: '#/components/schemas/StockPhotoStatus'
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        usageCount:
          type: integer
          format: int64
          nullable: true
          description: >
            Number of boxes AND box templates currently bound to this stock photo via image_id, summed
            into one figure. Present on admin list/detail responses; null/absent on the merchant-facing
            selection list. Templates count because retiring a photo SET NULLs their binding too, so a
            box-only number would report a photo as safe to retire when it is not.

    StockPhotoSelectionItem:
      type: object
      description: Merchant-facing view of a stock photo for the selection step (active-only list).
      required:
        - id
        - imageUrl
        - category
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategory'
        sortOrder:
          type: integer

    CreateStockPhotoRequest:
      type: object
      required:
        - imageUrl
        - category
      properties:
        imageUrl:
          type: string
          description: Image URL (uploaded first via the image upload endpoint, or any reachable URL).
        category:
          $ref: '#/components/schemas/ProductCategory'
        status:
          $ref: '#/components/schemas/StockPhotoStatus'
          description: Defaults to ACTIVE so a freshly uploaded photo is immediately selectable.
        sortOrder:
          type: integer
          default: 0
          description: Ordering within a category (ascending). Defaults to 0.

    UpdateStockPhotoRequest:
      type: object
      description: All fields optional; an omitted field is left unchanged.
      properties:
        category:
          $ref: '#/components/schemas/ProductCategory'
          nullable: true
        status:
          $ref: '#/components/schemas/StockPhotoStatus'
          nullable: true
        sortOrder:
          type: integer
          nullable: true

    PlatformVersionRequirement:
      type: object
      description: >
        Per-platform version requirement. Used both in the public read response and (per platform) in
        the admin write request, so the shape is symmetric.
      required:
        - minSupported
      properties:
        minSupported:
          type: string
          description: Hard floor (dotted-numeric, e.g. "1.4.0"). A client below this must update.
          example: "1.4.0"
        latest:
          type: string
          nullable: true
          description: Newest published version (dotted-numeric); optional, for a soft update nudge.
          example: "1.5.0"

    AppVersionRequirementsResponse:
      type: object
      description: Per-platform app version requirements. Both keys are always present.
      required:
        - android
        - ios
      properties:
        android:
          $ref: '#/components/schemas/PlatformVersionRequirement'
        ios:
          $ref: '#/components/schemas/PlatformVersionRequirement'

    UpdateAppVersionRequirementsRequest:
      type: object
      description: >
        Admin upsert payload; both platforms are required and are written together. Same per-platform
        shape as the read response.
      required:
        - android
        - ios
      properties:
        android:
          $ref: '#/components/schemas/PlatformVersionRequirement'
        ios:
          $ref: '#/components/schemas/PlatformVersionRequirement'

    MyRecommendationRole:
      type: string
      description: How the caller is involved in a recommendation on their 我敲過的店 list.
      enum:
        - RECOMMENDER
        - VOTER

    MyRecommendationResponse:
      type: object
      description: >
        An entry on 我敲過的店. Distinct from RecommendationResponse because the two endpoints answer
        different questions — the 敲碗榜 shows active rows, this shows outcomes. Never carries
        threshold or thresholdReachedAt.
      required:
        - id
        - storeName
        - storeAddress
        - reason
        - status
        - voteCount
        - myRole
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
          example: 好食早餐
        storeAddress:
          type: string
          example: 台北市信義區 123
        reason:
          type: string
          example: 想吃他們的蛋餅
        placeId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        voteCount:
          type: integer
          format: int64
          example: 51
        myRole:
          $ref: '#/components/schemas/MyRecommendationRole'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          example: "2026-08-06T10:00:00Z"

    RecommendationThresholdResponse:
      type: object
      description: >
        The effective 敲碗 vote threshold. Admin-only — this value is deliberately never exposed to
        consumer clients, since showing progress towards it would read as a promise of merchant
        outreach.
      required:
        - threshold
        - isDefault
      properties:
        threshold:
          type: integer
          description: Vote count at which the Discord alert fires.
          example: 50
        isDefault:
          type: boolean
          description: >
            True when no override is stored and the built-in default is in force. Lets the admin UI
            distinguish "never configured" from "explicitly set to the same number".
          example: true
        updatedAt:
          type: string
          nullable: true
          description: UTC timestamp of the last override write; null when isDefault is true.
          example: "2026-08-06T10:00:00Z"

    UpdateRecommendationThresholdRequest:
      type: object
      required:
        - threshold
      properties:
        threshold:
          type: integer
          minimum: 1
          description: New vote threshold. Must be a positive integer.
          example: 50

    ReservationStatus:
      type: string
      enum:
        - ACTIVE
        - PICKED_UP
        - CANCELLED
        - NO_SHOW
        - EXPIRED
      description: |
        Derived reservation lifecycle state.
        - ACTIVE: confirmed, pickup window has not yet closed
        - PICKED_UP: customer redeemed the box
        - CANCELLED: cancelled by consumer, merchant, or admin
        - NO_SHOW: pickup window expired and batch job has processed it (noShowProcessedAt is set)
        - EXPIRED: pickup window has ended but batch job has not yet run

    RecommendationStatus:
      type: string
      enum:
        - PENDING
        - IN_NEGOTIATION
        - ONBOARDED
        - REJECTED
      description: |
        Lifecycle of a store recommendation. Only PENDING and IN_NEGOTIATION ("active") appear on the
        public listing, the city chart, the feed and lookup; ONBOARDED and REJECTED drop out.
        ONBOARDED rows with a merchant appear on the wins list (GET /api/recommendations/onboarded).

    RecommendationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
        storeAddress:
          type: string
        reason:
          type: string
        placeId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        voteCount:
          type: integer
          format: int64
        hasVoted:
          type: boolean
          description: Whether the calling user has voted for this recommendation
        isOwnRecommendation:
          type: boolean
          description: Whether the calling user authored this recommendation (the client renders own recommendations read-only). Omitted when false.
        latitude:
          type: number
          format: double
          nullable: true
          description: Store latitude when known (omitted when null)
        longitude:
          type: number
          format: double
          nullable: true
          description: Store longitude when known (omitted when null)
        createdAt:
          type: string
          format: date-time

    AdminRecommendationListItem:
      type: object
      description: |
        Admin view of a recommendation. Unlike RecommendationResponse, it exposes the recommender's
        identity (id and display name) and the aggregated structured answers (敲碗 v3), and omits the
        consumer-only hasVoted/isOwnRecommendation flags.
      required:
        - id
        - storeName
        - storeAddress
        - reason
        - placeId
        - status
        - voteCount
        - recommenderUserId
        - recommenderDisplayName
        - anonymous
        - createdAt
        - city
        - distinctKnockers
        - answers
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
        storeAddress:
          type: string
        reason:
          type: string
          description: The recommender's free text (legacy `reason`, or the v3 `note`). Empty when none.
        placeId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        voteCount:
          type: integer
          format: int64
        recommenderUserId:
          type: string
          format: uuid
        recommenderDisplayName:
          type: string
        anonymous:
          type: boolean
          description: Whether the recommender opted to stay anonymous (name hidden on the public store profile)
        createdAt:
          type: string
          format: date-time
        city:
          allOf:
            - $ref: '#/components/schemas/TaiwanCity'
          nullable: true
          description: City derived server-side from the address; null when the address names no Taiwan city.
        distinctKnockers:
          type: integer
          format: int64
          description: The recommender plus every voter (`voteCount + 1`). The alert threshold is compared against this.
        answers:
          $ref: '#/components/schemas/KnockAnswerAggregates'

    TaiwanCity:
      type: string
      description: |
        Taiwan's 22 cities and counties (縣市), the scope of the 敲碗 city chart, city feed and wins.
        This fixed list is the city picker's source — there is no endpoint for it.
        **One spelling: 台, never 臺** (it matches Google's zh-TW formatted addresses). The `city` query
        parameter also accepts the 臺 spelling (臺北市 → 台北市); responses always use 台.
      enum:
        - 台北市
        - 新北市
        - 基隆市
        - 桃園市
        - 新竹市
        - 新竹縣
        - 苗栗縣
        - 台中市
        - 彰化縣
        - 南投縣
        - 雲林縣
        - 嘉義市
        - 嘉義縣
        - 台南市
        - 高雄市
        - 屏東縣
        - 宜蘭縣
        - 花蓮縣
        - 台東縣
        - 澎湖縣
        - 金門縣
        - 連江縣

    VisitFrequency:
      type: string
      description: 你多常去？ — WEEKLY 每週去 · MONTHLY 每月去 · RARELY 偶爾
      enum:
        - WEEKLY
        - MONTHLY
        - RARELY

    WantedItem:
      type: string
      description: 你想救什麼？ — BREAD 麵包 · BENTO 便當 · DESSERT 甜點 · DELI 熟食 · DRINKS 飲料 · OTHER 其他
      enum:
        - BREAD
        - BENTO
        - DESSERT
        - DELI
        - DRINKS
        - OTHER

    CreateRecommendationRequest:
      type: object
      description: |
        Two accepted shapes:
        - **v3 clients** send `visitFrequency` and at least one `wantedItems` value (both required as
          soon as any of `visitFrequency` / `wantedItems` / `note` is present) plus an optional `note`.
        - **Legacy clients** send only `reason` and no answers. Still accepted; `reason` is kept as
          the recommender's note.

        `note` wins over `reason` when both are sent. A body with neither answers nor `reason` is
        400 `RECOMMENDATION_ANSWERS_REQUIRED`. The city is never sent: the server derives it from
        `storeAddress`.
      required:
        - storeName
        - storeAddress
      properties:
        storeName:
          type: string
          example: 好食早餐
        storeAddress:
          type: string
          description: The Places formatted address. The server parses the city (縣市) from it.
          example: 110台灣台北市信義區松壽路1號
        reason:
          type: string
          nullable: true
          maxLength: 50
          description: Legacy free text (pre-v3 apps). Optional; maps to `note`.
        placeId:
          type: string
          nullable: true
          description: Google Places place_id resolved via GET /api/places/{placeId}
        latitude:
          type: number
          format: double
          nullable: true
          description: Resolved latitude (-90..90); must accompany longitude
        longitude:
          type: number
          format: double
          nullable: true
          description: Resolved longitude (-180..180); must accompany latitude
        anonymous:
          type: boolean
          default: false
          description: When true the recommender's name is hidden on the store's profile credit.
        visitFrequency:
          allOf:
            - $ref: '#/components/schemas/VisitFrequency'
          nullable: true
          description: Required for v3 submissions.
        wantedItems:
          type: array
          nullable: true
          description: Required (at least one) for v3 submissions. Duplicates are ignored.
          items:
            $ref: '#/components/schemas/WantedItem'
        note:
          type: string
          nullable: true
          maxLength: 50
          description: Optional free text (trimmed; blank = none).

    RecommendationMatch:
      type: object
      description: The existing active recommendation returned when a create is a possible duplicate.
      required:
        - id
        - storeName
        - storeAddress
        - voteCount
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
        storeAddress:
          type: string
        voteCount:
          type: integer
          format: int64

    CreateRecommendationResponse:
      type: object
      description: |
        Either a row was created (`possibleDuplicate: false`, `recommendation` and `item` set) or an
        active match was found (`possibleDuplicate: true`, `match` and `item` set, no row created).
        `recommendation` and `match` keep their pre-v3 shapes for old apps; `item` is the v3 shape of
        the created row or the match. Absent fields are omitted from the JSON.
      required:
        - possibleDuplicate
      properties:
        possibleDuplicate:
          type: boolean
        match:
          allOf:
            - $ref: '#/components/schemas/RecommendationMatch'
          nullable: true
        recommendation:
          allOf:
            - $ref: '#/components/schemas/RecommendationResponse'
          nullable: true
        item:
          allOf:
            - $ref: '#/components/schemas/RecommendationItem'
          nullable: true

    KnockAnswersRequest:
      type: object
      description: |
        A knocker's structured answers — the optional body of the vote, and the body of the answers
        upsert (which replaces the caller's answers as a whole). Every field is optional.
      properties:
        visitFrequency:
          allOf:
            - $ref: '#/components/schemas/VisitFrequency'
          nullable: true
        wantedItems:
          type: array
          nullable: true
          description: Duplicates are ignored.
          items:
            $ref: '#/components/schemas/WantedItem'
        note:
          type: string
          nullable: true
          maxLength: 50
          description: Trimmed; blank = none. Over 50 characters is 400 RECOMMENDATION_NOTE_TOO_LONG.

    KnockAnswersResponse:
      type: object
      description: The caller's own answers (never anyone else's).
      required:
        - visitFrequency
        - wantedItems
        - note
      properties:
        visitFrequency:
          allOf:
            - $ref: '#/components/schemas/VisitFrequency'
          nullable: true
        wantedItems:
          type: array
          description: In enum order, no duplicates. Empty when none.
          items:
            $ref: '#/components/schemas/WantedItem'
        note:
          type: string
          nullable: true

    RecommendationItem:
      type: object
      description: |
        The one consumer shape of a 敲碗 store, shared by the chart, feed, wins, lookup, detail, and the
        create / vote / answers responses.

        Aggregates only: other knockers' answers and notes never appear (`topWantedItems` is a
        count-ranked list of enum values), and there is deliberately **no threshold and no
        thresholdReachedAt** — counts show neighbours, never progress toward a goal. There is no
        `reason` either (on someone else's store it would be another user's note).
      required:
        - id
        - storeName
        - storeAddress
        - placeId
        - city
        - latitude
        - longitude
        - status
        - distinctKnockers
        - weeklyKnocks
        - lastActivityAt
        - topWantedItems
        - hasVoted
        - isOwnRecommendation
        - myAnswers
        - merchantId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
          example: 好食早餐
        storeAddress:
          type: string
        placeId:
          type: string
          nullable: true
        city:
          allOf:
            - $ref: '#/components/schemas/TaiwanCity'
          nullable: true
          description: Null when the address names no Taiwan city (such rows only appear in the radius feed).
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        distinctKnockers:
          type: integer
          format: int64
          minimum: 1
          description: The recommender plus every voter — 「你是第 N 位敲碗的鄰居」.
          example: 5
        weeklyKnocks:
          type: integer
          format: int64
          description: Knocks (the create and each vote) in the last 7 days — 「本週 +N」.
          example: 2
        lastActivityAt:
          type: string
          format: date-time
          description: The latest knock (create or vote). Answer edits do not count. The feed sorts on it.
          example: "2026-10-06T10:00:00Z"
        topWantedItems:
          type: array
          maxItems: 3
          description: Up to 3 most-wanted items across all knockers' answers, most first (ties in enum order). Empty until someone answers.
          items:
            $ref: '#/components/schemas/WantedItem'
        hasVoted:
          type: boolean
          description: Whether the caller voted. Always false for an anonymous caller.
        isOwnRecommendation:
          type: boolean
          description: Whether the caller submitted it. Always false for an anonymous caller.
        myAnswers:
          allOf:
            - $ref: '#/components/schemas/KnockAnswersResponse'
          nullable: true
          description: The caller's own answers, to prefill the optional sheet. Null when none or anonymous.
        merchantId:
          type: string
          format: uuid
          nullable: true
          description: The merchant created from this recommendation, if any (wins credit line; share links can open the store).
        createdAt:
          type: string
          format: date-time

    VoteResponse:
      type: object
      required:
        - message
        - item
      properties:
        message:
          type: string
          example: Vote recorded
          description: Unchanged from before v3, so old apps that read it keep working.
        item:
          $ref: '#/components/schemas/RecommendationItem'

    RecommendationLookupState:
      type: string
      description: |
        - ON_PLATFORM: a merchant has this place_id → open the store (`merchantId`)
        - KNOCKED: an active (PENDING / IN_NEGOTIATION) recommendation has it → +1 (`recommendation`)
        - NEW: neither (REJECTED and ONBOARDED-without-merchant rows also read as NEW) → knock it
      enum:
        - ON_PLATFORM
        - KNOCKED
        - NEW

    RecommendationLookupResponse:
      type: object
      required:
        - state
        - merchantId
        - recommendation
      properties:
        state:
          $ref: '#/components/schemas/RecommendationLookupState'
        merchantId:
          type: string
          format: uuid
          nullable: true
          description: Set only for ON_PLATFORM.
        recommendation:
          allOf:
            - $ref: '#/components/schemas/RecommendationItem'
          nullable: true
          description: Set only for KNOCKED.

    KnockNote:
      type: object
      description: A note left by one knocker (admin-only).
      required:
        - note
        - at
      properties:
        note:
          type: string
        at:
          type: string
          format: date-time
          description: When the answers carrying this note were last written.

    KnockAnswerAggregates:
      type: object
      description: |
        Admin-only aggregate of a recommendation's structured answers. Both count maps always carry
        every enum key (zero-filled). "N of M answered" is `answeredCount` of `knockerCount`.
      required:
        - knockerCount
        - answeredCount
        - visitFrequency
        - wantedItems
        - recentNotes
      properties:
        knockerCount:
          type: integer
          format: int64
          description: distinctKnockers (the recommender plus every voter).
        answeredCount:
          type: integer
          format: int64
          description: Knockers who answered at least one structured question (a note alone does not count).
        visitFrequency:
          type: object
          description: Knockers per visit frequency.
          required: [WEEKLY, MONTHLY, RARELY]
          properties:
            WEEKLY:
              type: integer
              format: int64
            MONTHLY:
              type: integer
              format: int64
            RARELY:
              type: integer
              format: int64
        wantedItems:
          type: object
          description: Knockers who want each item.
          required: [BREAD, BENTO, DESSERT, DELI, DRINKS, OTHER]
          properties:
            BREAD:
              type: integer
              format: int64
            BENTO:
              type: integer
              format: int64
            DESSERT:
              type: integer
              format: int64
            DELI:
              type: integer
              format: int64
            DRINKS:
              type: integer
              format: int64
            OTHER:
              type: integer
              format: int64
        recentNotes:
          type: array
          description: Newest first — up to 3 on the list endpoint, up to 20 on the detail endpoint.
          items:
            $ref: '#/components/schemas/KnockNote'

    PlacePrediction:
      type: object
      description: A single Google Places autocomplete suggestion (proxied, slimmed down)
      properties:
        placeId:
          type: string
        primaryText:
          type: string
          description: Main label (typically the place name)
        secondaryText:
          type: string
          description: Secondary label (typically the address)

    PlaceDetails:
      type: object
      description: Resolved place details (proxied, slimmed down)
      required:
        - placeId
        - name
        - address
        - latitude
        - longitude
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        city:
          allOf:
            - $ref: '#/components/schemas/TaiwanCity'
          nullable: true
          description: |
            Taiwan city from Google's administrative_area_level_1 (臺 folded to 台), falling back to
            parsing the address. Omitted when unknown or outside Taiwan. Display-only — POST
            /api/recommendations derives the stored city itself.

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
          nullable: true

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
          nullable: true

    LineTokenVerifyRequest:
      type: object
      required:
        - lineAccessToken
      properties:
        lineAccessToken:
          type: string
          description: LINE SDK access token

    AppleTokenVerifyRequest:
      type: object
      required:
        - identityToken
      properties:
        identityToken:
          type: string
          description: Apple identity token (JWT from ASAuthorizationController)
        fullName:
          type: string
          nullable: true
          description: User's full name (only provided on first sign-in with Apple)
        email:
          type: string
          nullable: true
          description: User's email (only provided on first sign-in with Apple)
        nonce:
          type: string
          nullable: true
          description: >-
            The raw nonce generated for this sign-in. Set `ASAuthorizationAppleIDRequest.nonce` to its
            SHA-256 as lowercase hex and send the raw value here. When the identity token carries a
            nonce, this is required and must hash to it. A token without one is accepted unless the
            server sets APPLE_REQUIRE_NONCE.

    GoogleTokenVerifyRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: Google ID token (JWT from Credential Manager on Android, or the GoogleSignIn SDK on iOS)

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    MerchantLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    MerchantApplicationRequest:
      type: object
      description: A public "apply to join" lead submitted from the marketing website.
      required:
        - storeName
        - contactName
        - phone
        - location
      properties:
        storeName:
          type: string
          description: Store / business name (as entered by the applicant)
        contactName:
          type: string
          description: Name of the person to contact
        phone:
          type: string
          description: Contact phone number
        email:
          type: string
          format: email
          nullable: true
          description: Optional contact email
        location:
          $ref: '#/components/schemas/MerchantApplicationLocation'

    MerchantApplicationLocation:
      type: object
      description: Store location, as resolved by the client from GET /api/places/{placeId}.
      required:
        - address
      properties:
        placeId:
          type: string
          nullable: true
          description: Google Places place_id, if a place was picked
        name:
          type: string
          nullable: true
          description: The place's own name from Google (may differ from storeName)
        address:
          type: string
          description: Store address
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true

    MerchantApplicationCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The created application's id

    MerchantApplicationStatus:
      type: string
      description: |
        Contact-workflow state of a lead. New submissions default to IDLE; the ops team advances it.
        - IDLE: not yet contacted
        - IN_PROGRESS: outreach underway
        - FAILED: could not be reached / did not work out
        - COMPLETED: onboarded / done
      enum:
        - IDLE
        - IN_PROGRESS
        - FAILED
        - COMPLETED

    MerchantApplicationResponse:
      type: object
      description: A lead as seen by an admin — everything needed to decide whom to contact and track follow-up.
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        placeId:
          type: string
          nullable: true
        placeName:
          type: string
          nullable: true
        storeAddress:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          $ref: '#/components/schemas/MerchantApplicationStatus'
        createdAt:
          type: string
          format: date-time

    FeedbackCategory:
      type: string
      description: |
        What the message is about, picked from the app's chips.
        - SHARE_EXPERIENCE: 分享心得
        - FEATURE_WISH: 許願新功能
        - COULD_BE_BETTER: 哪裡可以更好
        - OTHER: 其他
      enum:
        - SHARE_EXPERIENCE
        - FEATURE_WISH
        - COULD_BE_BETTER
        - OTHER

    FeedbackPlatform:
      type: string
      enum:
        - ANDROID
        - IOS

    FeedbackStatus:
      type: string
      description: Inbox state. NEW until an admin first opens the message, then READ.
      enum:
        - NEW
        - READ

    CreateFeedbackRequest:
      type: object
      required:
        - category
        - message
        - appVersion
        - platform
      properties:
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        message:
          type: string
          description: Trimmed before storing; must be non-blank and at most 500 characters.
          maxLength: 500
        appVersion:
          type: string
          description: Installed app version name, e.g. "1.4.0". Non-blank, at most 32 characters.
          maxLength: 32
        platform:
          $ref: '#/components/schemas/FeedbackPlatform'

    FeedbackCreatedResponse:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    AdminFeedbackResponse:
