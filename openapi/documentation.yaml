            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SessionInfo'
        '401':
          description: LINE token verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/user/apple/verify-token:
    post:
      tags:
        - User
      summary: Verify Apple identity token
      description: Verify Apple identity token (Sign in with Apple) and authenticate user. Returns JWT tokens for subsequent API calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleTokenVerifyRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SessionInfo'
        '401':
          description: Apple token verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/user/refresh:
    post:
      tags:
        - User
      summary: Refresh access token
      description: Get a new access token using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
