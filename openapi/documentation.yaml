        message:
          type: string
        appVersion:
          type: string
        platform:
          $ref: '#/components/schemas/FeedbackPlatform'
        status:
          $ref: '#/components/schemas/FeedbackStatus'
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When an admin first opened it; null while NEW.

    FoodLogEntryResponse:
      type: object
      description: |
        One 我的食記 entry: created automatically when an order is verified as picked up (核銷). Only
        ever returned to its owner (and to admins); never by a merchant-facing or public endpoint.
      required:
        - id
        - reservationId
        - orderId
        - storeId
        - storeName
        - pricePaid
        - pickedUpAt
        - photoUrl
        - note
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
          description: The picked-up reservation this entry belongs to (one entry per reservation).
        orderId:
          type: string
          description: The reservation's human order number.
          example: "#8821"
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
          description: Store name as it was at pickup (snapshot).
        pricePaid:
          type: integer
          description: What the reservation paid (snapshot).
        pickedUpAt:
          type: string
          format: date-time
          description: |
            When the order was picked up, ISO-8601 UTC with Z. For pickups from before this was recorded,
            the end of the pickup window (else the reservation's creation time).
          example: "2026-01-15T10:30:00Z"
        photoUrl:
          type: string
          nullable: true
          description: Always present; null when no photo.
        note:
          type: string
          nullable: true
          maxLength: 200
          description: Always present; null when no note.
        visibility:
          type: string
          enum:
            - PRIVATE
            - PUBLIC
          description: PRIVATE for every entry in phase 1; PUBLIC is reserved.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FoodLogEntryPage:
      type: object
      description: A page of food-log entries, newest pickup first (pickedUpAt DESC, then id).
      required:
        - items
        - page
        - size
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FoodLogEntryResponse'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer

    FoodLogSummaryResponse:
      type: object
      required:
        - entryCount
        - storeCount
      properties:
        entryCount:
          type: integer
          description: Non-deleted entries.
        storeCount:
          type: integer
          description: Distinct stores among the non-deleted entries.

    UpdateFoodLogEntryRequest:
      type: object
      description: |
        Full replacement of the editable fields: an absent or null field clears it.
      properties:
        photoUrl:
          type: string
          nullable: true
          description: |
            The publicUrl from GET /api/user/images/presigned (an object directly in the avatar bucket),
            or the entry's current photoUrl unchanged. Anything else is 400 INVALID_IMAGE_URL.
        note:
          type: string
          nullable: true
          description: |
            Trimmed; blank is stored as null. At most 200 characters, counted as UTF-16 code units
            (Kotlin String.length — an emoji outside the BMP counts as 2); longer is 400
            FOOD_LOG_NOTE_TOO_LONG.

    UpdateMerchantApplicationStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/MerchantApplicationStatus'

    CreateReservationRequest:
      type: object
      required:
        - boxId
      properties:
        boxId:
          type: string
          format: uuid

    CreateBoxRequest:
      type: object
      required:
        - name
        - originalPrice
        - discountedPrice
        - quantity
        - pickupTimeStart
        - pickupTimeEnd
        - saleTimeStart
        - saleTimeEnd
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        originalPrice:
          type: integer
        discountedPrice:
          type: integer
        quantity:
          type: integer
        pickupTimeStart:
          type: string
          example: "18:00"
        pickupTimeEnd:
          type: string
          example: "20:00"
        saleTimeStart:
          type: string
          example: "10:00"
        saleTimeEnd:
          type: string
          example: "17:00"
        saleDate:
          type: string
          nullable: true
          description: "Sale date in yyyy-MM-dd format (e.g., 2025-01-15). Defaults to today if not provided. Cannot be in the past."
          example: "2025-03-20"
        category:
          $ref: '#/components/schemas/ProductCategory'
          nullable: true
          description: "Product category for this box. Optional; defaults to GENERAL (綜合) when omitted."
        imageId:
          type: string
          format: uuid
          nullable: true
          description: >
            The selected stock photo (from GET /api/merchant/stock-photos). Optional; when omitted the
            box resolves to the category default image. A malformed id is 400 INVALID_FORMAT; a
            well-formed id with no matching photo is 404 STOCK_PHOTO_NOT_FOUND.
        eligibilityType:
          $ref: '#/components/schemas/PurchaseEligibilityType'
          nullable: true
          description: >
            Who this listing is open to. Optional; **omitted means UNRESTRICTED**. Full PUT on update,
            so omitting the field RESETS the box to UNRESTRICTED. Frozen once the box has any active
            reservation: changing it is 422 ELIGIBILITY_LOCKED.
        eligibilityThreshold:
          type: integer
          minimum: 1
          nullable: true
          description: >
            The N of RETURNING_CUSTOMER(N) — the number of collected orders at this store a caller needs.
            REQUIRED when eligibilityType is RETURNING_CUSTOMER; a missing or non-positive value is
            400 INVALID_ELIGIBILITY_THRESHOLD. Ignored for every other type.
          example: 3
        boxTemplateId:
          type: string
          format: uuid
          nullable: true
          description: >
            The template this listing is being created from. Set at CREATE time only; an update ignores
            this field. REQUIRED when eligibilityType is ONCE_PER_TEMPLATE — an ad-hoc box with that
            setting is 400 ELIGIBILITY_TEMPLATE_REQUIRED. A malformed id is 400 INVALID_FORMAT; an id
            that does not exist or belongs to another merchant is 404 TEMPLATE_NOT_FOUND.

