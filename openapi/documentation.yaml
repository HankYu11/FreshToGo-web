  /api/admin/users:
    get:
      tags:
        - Admin Users
      summary: List users (admin)
      description: |
        Consumers, newest first. `search` and `isBlocked` compose — supplying both narrows to their
        intersection.
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match against display name.
          schema:
            type: string
        - name: isBlocked
          in: query
          required: false
          description: >-
            Omit or send empty to return both blocked and unblocked users. Any other non-boolean value
            is a 400, never a silently unfiltered list.
          schema:
            type: boolean
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminUserListItem'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalItems:
                        type: integer
                        format: int64
                      totalPages:
                        type: integer
        '400':
          description: >-
            A non-empty `isBlocked` that is not `true`/`false` (INVALID_FORMAT). A filter is never
            dropped silently — an unusable one is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required

  /api/admin/users/at-risk:
    get:
      tags:
        - Admin Users
      summary: Users approaching the no-show block
      description: |
        Users whose `noShowCount` has reached `minNoShowCount`. Unpaginated. The block threshold is 3,
        so the default of 2 surfaces people one no-show away from losing reservation access.
      security:
        - adminAuth: []
      parameters:
        - name: minNoShowCount
          in: query
          required: false
          description: >-
            Omit or send empty for the default of 2. A non-empty value that is not an integer is a 400
            rather than a silent fall back to the default.
          schema:
            type: integer
            default: 2
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserListItem'
        '400':
          description: >-
            A non-empty `minNoShowCount` that is not an integer (INVALID_FORMAT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required

  /api/admin/users/{id}:
    get:
      tags:
        - Admin Users
      summary: User detail with reservation stats
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: Malformed user ID
        '401':
          description: Admin authentication required
        '404':
          description: No such user
    patch:
      tags:
        - Admin Users
      summary: Block, unblock, or adjust a user's no-show count
      description: |
        `isBlocked` is the single gate on creating reservations, so clearing it restores access
        immediately. Setting `noShowCount` back to 0 is the usual way to give someone a clean slate —
        it does not by itself unblock them.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminUserDetail'
        '400':
          description: Malformed user ID
        '401':
          description: Admin authentication required
        '404':
          description: No such user
    delete:
      tags:
        - Admin Users
      summary: Delete a user account
      description: |
        Cancels the user's active reservations — restoring the boxes to sale — then deletes the
        account. Reservations, refresh tokens and FCM tokens cascade. Irreversible.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Malformed user ID
        '401':
          description: Admin authentication required
        '404':
          description: No such user

  /api/admin/boxes:
    get:
      tags:
        - Admin Boxes
      summary: List boxes (admin)
      description: |
        Boxes across all merchants, newest first. Every filter composes — supplying several narrows to
        their intersection.

        `status` matches the derived `BoxStatus` each item reports, including the two that depend on
        the clock rather than on stock (BEFORE_SALE, EXPIRED). Accepts a comma-separated list, is
        case-insensitive, and rejects anything outside the enum with 400 rather than returning an
        empty page.

        `eligibilityType` follows exactly that discipline: comma-separated, case-insensitive, and a
        400 listing the accepted values for anything outside `PurchaseEligibilityType`. It matches the
        rule each row *reads as*, so `eligibilityType=UNRESTRICTED` includes every listing created
        before purchase eligibility existed (those store NULL and render as UNRESTRICTED).

        **Sale date comes in two forms and they cannot be combined.** `saleDate` is one exact day;
        `saleDateFrom`/`saleDateTo` are an inclusive range, and either end may be given alone. Sending
        `saleDate` together with either range bound is a 400, and so is a malformed date. An empty value
        (`?saleDate=`) counts as absent.
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: merchantId
          in: query
          required: false
          description: >-
            Scope to one merchant. Omit or send empty for all merchants; a non-empty value that is not
            a UUID is a 400, never a silently unfiltered list.
          schema:
            type: string
            format: uuid
        - name: saleDate
          in: query
          required: false
          description: One exact sale date. Cannot be combined with saleDateFrom/saleDateTo.
          schema:
            type: string
            format: date
        - name: saleDateFrom
          in: query
          required: false
          description: >
            Earliest sale date, inclusive. May be sent without saleDateTo. Cannot be combined with
            saleDate.
          schema:
            type: string
            format: date
        - name: saleDateTo
          in: query
          required: false
          description: >
            Latest sale date, inclusive. May be sent without saleDateFrom. Cannot be combined with
            saleDate.
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          description: One or more BoxStatus values, comma-separated.
          schema:
            type: string
            example: AVAILABLE,ALMOST_SOLD_OUT
        - name: eligibilityType
          in: query
          required: false
          description: >
            One or more PurchaseEligibilityType values, comma-separated and case-insensitive. Anything
            outside the enum is a 400 listing the accepted values.
          schema:
            type: string
            example: FIRST_TIME_AT_STORE,RETURNING_CUSTOMER
      responses:
        '200':
          description: Boxes returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminBoxListItem'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalItems:
                        type: integer
                        format: int64
                      totalPages:
                        type: integer
        '400':
          description: >
            `BAD_REQUEST` — a status or eligibilityType outside its enum, saleDate combined with a
            range bound, or saleDateFrom after saleDateTo. `INVALID_FORMAT` — a sale-date parameter
            that is not an ISO-8601 date, or a non-empty merchantId that is not a UUID. A filter is
            never dropped silently — an unusable one is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required

  /api/admin/boxes/eligibility-breakdown:
    get:
      tags:
        - Admin Boxes
      summary: Eligibility mix of a window of listings (admin)
      description: |
        The restricted-listing share and the per-value counts for every listing whose **sale date**
        falls in `saleDateFrom`..`saleDateTo`, optionally narrowed to one merchant.

        Sale date, not creation time: it is the date the box list filters and sorts on, so
        `GET /api/admin/boxes?saleDateFrom=…&saleDateTo=…&eligibilityType=…` returns exactly the
        listings that were counted.

        **Both window bounds are required.**
      security:
        - adminAuth: []
      parameters:
        - name: saleDateFrom
          in: query
          required: true
          description: Earliest sale date counted, inclusive.
          schema:
            type: string
            format: date
        - name: saleDateTo
          in: query
          required: true
          description: Latest sale date counted, inclusive. Must not be earlier than saleDateFrom.
          schema:
            type: string
            format: date
        - name: merchantId
          in: query
          required: false
          description: >
            Narrow to one store. Omit for every merchant. Stricter than the list endpoint's
            `merchantId`: a value that is not a UUID is a 400, not a silently widened scope.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Breakdown returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminEligibilityBreakdown'
        '400':
          description: >
            `MISSING_FIELD` — saleDateFrom or saleDateTo absent. `INVALID_FORMAT` — a sale-date
            parameter that is not an ISO-8601 date, or a merchantId that is not a UUID. `BAD_REQUEST` —
            saleDateFrom after saleDateTo, or saleDate sent alongside the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required
        '404':
          description: '`MERCHANT_NOT_FOUND` — the given merchantId names no store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/admin/boxes/{id}:
    get:
      tags:
        - Admin Boxes
      summary: Box detail with its reservations
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Box returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminBoxDetail'
        '400':
          description: Malformed box ID
        '401':
          description: Admin authentication required
        '404':
          description: No such box

  /api/admin/reservations:
    get:
      tags:
        - Admin Reservations
      summary: List reservations (admin)
      description: |
        Reservations across all merchants, newest first. Every filter composes — supplying several
        narrows to their intersection, and `merchantId` scopes to that merchant's boxes only (a
        merchant with no boxes returns nothing).

        `status` matches the derived `ReservationStatus` each item reports, so EXPIRED is separated
        from ACTIVE by the pickup window. Case-insensitive; anything outside the enum is a 400 rather
        than a silently unfiltered list.
      security:
        - adminAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: merchantId
          in: query
          required: false
          description: >-
            Scope to one merchant's boxes. Omit or send empty for all merchants; a non-empty value that
            is not a UUID is a 400, never a silently unfiltered list.
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          description: >-
            Scope to one customer. Omit or send empty for all; a non-empty value that is not a UUID is
            a 400.
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          required: false
          description: Inclusive lower bound on pickup date.
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: Inclusive upper bound on pickup date.
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReservationStatus'
      responses:
        '200':
          description: Reservations returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminReservationListItem'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalItems:
                        type: integer
                        format: int64
                      totalPages:
                        type: integer
        '400':
          description: >-
            Unrecognised `status` value (BAD_REQUEST), or a non-empty `merchantId`/`userId` that is not
            a UUID (INVALID_FORMAT). A filter is never dropped silently — an unusable one is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required

  /api/admin/reservations/{id}:
    get:
      tags:
        - Admin Reservations
      summary: Reservation detail
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminReservationDetail'
        '400':
          description: Malformed reservation ID
        '401':
          description: Admin authentication required
        '404':
          description: No such reservation, or its box/merchant/user is missing

  /api/admin/reservations/{id}/cancel:
    patch:
      tags:
        - Admin Reservations
      summary: Cancel a reservation (admin)
      description: |
        Cancels on the customer's behalf, restoring the box's remaining count and pushing a
        cancellation notice to the customer and the merchant. Only a reservation that is neither
        picked up nor already cancelled can be cancelled.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Malformed reservation ID, or the reservation is already picked up or cancelled
        '401':
          description: Admin authentication required
        '404':
          description: No such reservation

  /api/admin/reservations/{id}/pickup:
    patch:
      tags:
        - Admin Reservations
      summary: Mark a reservation picked up (admin)
      description: |
        Completes a pickup from the admin console — the recovery path when the merchant could not
        redeem in their app. Recorded with `redemptionMethod: "admin"`, and resets the customer's
        no-show count as a normal redemption does.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reservation marked as picked up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Malformed reservation ID, or the reservation is already picked up or cancelled
        '401':
          description: Admin authentication required
        '404':
          description: No such reservation

  /api/admin/notifications/broadcast:
    post:
      tags:
        - Admin Notifications
      summary: Broadcast a push notification
      description: |
        Sends a push to every consumer or every merchant holding a registered FCM token. Sent as an
        announcement, so notification preferences are not consulted. There is no undo.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastNotificationRequest'
      responses:
        '200':
          description: Broadcast dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BroadcastResult'
        '400':
          description: Unrecognised target
        '401':
          description: Admin authentication required

  /api/reservations/{id}/events:
    get:
      tags:
        - Reservations
      summary: Wait for a reservation state change (long poll)
      description: |
        Long-polls for the next change to the caller's own reservation, so the pickup screen can react
        the moment the merchant redeems the code instead of polling on a timer.

        Returns as soon as the reservation is picked up or cancelled; if nothing happens before the
        server-side timeout it returns the current state anyway, and the client simply calls again.
        The subscription is opened before the reservation is read, so an event landing during that
        window is not lost.
      security:
        - userAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The reservation's state, either after a change or at timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Malformed reservation ID
        '401':
          description: User authentication required
        '403':
          description: The reservation belongs to another user
        '404':
          description: No such reservation
