  /api/places/autocomplete:
    get:
      tags:
        - Places
      summary: Autocomplete place predictions
      description: |
        Proxies Google Places Autocomplete (New). The Google API key stays server-side. Pass a
        client-generated `sessionToken` and reuse it for the follow-up details call so Google bills
        the whole interaction as one session. Query-prediction suggestions (no concrete place) are
        omitted.

        Public endpoint — no authentication required. Used by the consumer app and by the public
        merchant "apply to join" form (POST /api/merchant/apply), where the caller has no session.
      parameters:
        - name: q
          in: query
          required: true
          description: The user's partial search input
          schema:
            type: string
        - name: sessionToken
          in: query
          required: false
          description: Client-generated session token, reused for the details call
          schema:
            type: string
        - name: languageCode
          in: query
          required: false
          description: Caller's locale (e.g. zh-TW), forwarded to Google so names come back localized
          schema:
            type: string
        - name: purpose
          in: query
          required: false
          description: |
            Opt-in restriction. `recommendation` (the 敲碗 store search) limits results to food
            businesses: Google `includedPrimaryTypes` = restaurant, bakery, cafe, meal_takeaway,
            food_store. Chains are not filtered. Omitted = unrestricted (unchanged behaviour); any
            other value is 400 INVALID_FORMAT.
          schema:
            type: string
            enum:
              - recommendation
      responses:
        '200':
          description: Predictions returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlacePrediction'
        '400':
          description: Missing required query parameter 'q' (MISSING_FIELD) or unknown purpose (INVALID_FORMAT)
        '502':
          description: Places lookup unavailable (key unset or upstream error) — PLACES_UNAVAILABLE
        '429':
          description: Rate limit exceeded for this client IP — RATE_LIMITED

  /api/places/{placeId}:
    get:
      tags:
        - Places
      summary: Resolve place details
      description: |
        Proxies Google Places Details (New) for a `placeId`, returning just the fields a
        recommendation needs (name, address, coordinates, and the Taiwan `city` when known). Pass the same `sessionToken` used for
        autocomplete to close the billing session.

        Public endpoint — no authentication required (see the autocomplete endpoint).
      parameters:
        - name: placeId
          in: path
          required: true
          description: Google Places place_id (from an autocomplete prediction)
          schema:
            type: string
        - name: sessionToken
          in: query
          required: false
          description: Session token from the autocomplete call
          schema:
            type: string
      responses:
        '200':
          description: Place details resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PlaceDetails'
        '404':
          description: Place not found — PLACE_NOT_FOUND
        '502':
          description: Places lookup unavailable (key unset or upstream error) — PLACES_UNAVAILABLE
        '429':
          description: Rate limit exceeded for this client IP — RATE_LIMITED

  /api/merchant/followers/count:
    get:
      tags:
        - Merchant
      summary: Get follower count
      description: Returns the total number of consumers currently following this merchant's store.
      security:
        - merchantAuth: []
      responses:
        '200':
          description: Follower count returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int64
                        example: 42
        '401':
          description: Merchant authentication required

  # ==================== INTERNAL ROUTES ====================
  /api/internal/check-expired:
    post:
      tags:
        - Internal
      summary: Process expired reservations
      description: |
        Marks all unpicked, uncancelled reservations whose pickup window has passed as no-shows.
        Increments `noShowCount` for affected users and blocks users who reach the threshold.
        Designed to be called by Cloud Scheduler. Requires `X-Internal-Api-Key` header.
      security:
        - internalApiKey: []
      responses:
        '200':
          description: Expired reservations processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      processedCount:
                        type: integer
                      failedCount:
                        type: integer
                      usersBlocked:
                        type: integer
        '401':
          description: Invalid or missing API key

  /api/internal/scheduled-listings/tick:
    post:
      tags:
        - Internal
      summary: Scheduled-day check-in reminders and lapses
      description: |
        For each enabled template schedule running today (merchant-local): sends the merchant one
        `SCHEDULED_LISTING_CHECKIN` push (notification with zh-TW copy plus data `type`, `templateId`, `saleDate`; no inbox row) from 60 minutes before the sale
        start if the day is still unconfirmed, and records the day MISSED once the sale start has passed.
        Nothing is sent on the day before. Skips merchants whose subscription has lapsed.
        Designed to be called by Cloud Scheduler every 5 minutes. Requires `X-Internal-Api-Key` header.
      security:
        - internalApiKey: []
      responses:
        '200':
          description: Tick processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ScheduledListingTickResult'
        '401':
          description: Invalid or missing API key

  /api/internal/send-rating-prompts:
    post:
      tags:
        - Internal
      summary: Send post-pickup thumbs-up prompts
      description: |
        Sends FCM push notifications inviting customers to give a thumbs-up, for reservations picked up
        at least ~1 hour ago that have not yet been prompted or rated. Stamps `rating_prompt_notified_at`
        so each reservation is prompted once. Respects the `ratingPromptEnabled` preference.
        Designed to be called by Cloud Scheduler. Requires `X-Internal-Api-Key` header.
      security:
        - internalApiKey: []
      responses:
        '200':
          description: Prompts sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NotificationResult'
        '401':
          description: Invalid or missing API key

  /api/internal/notify-pickup-window:
    post:
      tags:
        - Internal
      summary: Send READY_FOR_PICKUP notifications
      description: |
        Sends FCM push notifications to consumers whose reservation pickup window just opened.
        Respects `statusChangeEnabled` preference. Designed to be called by Cloud Scheduler every minute.
        Requires `X-Internal-Api-Key` header.
      security:
        - internalApiKey: []
      responses:
        '200':
          description: Notifications sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NotificationResult'
        '401':
          description: Invalid or missing API key

  /api/internal/notify-pickup-reminder:
    post:
      tags:
        - Internal
      summary: Send 30-minute pickup reminder notifications
      description: |
        Sends FCM push notifications to consumers whose reservation pickup window starts in approximately 30 minutes (25–35 min window).
        Respects `pickupReminderEnabled` preference. Cancelled or already-reminded reservations are excluded.
        Designed to be called by Cloud Scheduler every few minutes. Requires `X-Internal-Api-Key` header.
      security:
        - internalApiKey: []
      responses:
        '200':
          description: Reminder notifications sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NotificationResult'
        '401':
          description: Invalid or missing API key

  /api/internal/notify-sale-window:
    post:
      tags:
        - Internal
      summary: Send follow-upload notifications
      description: |
        Sends FCM push notifications to followers of merchants whose boxes just entered the sale window.
        Respects `listingEnabled` and `listingScope` preferences. Users with `ALL` scope are always notified; users with `FOLLOWED_ONLY` scope are notified only if they follow the publishing merchant.
        Purchase eligibility (`eligibilityType`) then narrows that audience further: a recipient who cannot see the box in the consumer list is not told about it either. A box whose whole audience is ineligible is still marked notified, so it is not retried. Order-related pushes (pickup window, pickup reminder, rating prompt, cancellation) are exempt — their audience is the order's owner, not an eligible audience.
        Designed to be called by Cloud Scheduler every minute. Requires `X-Internal-Api-Key` header.
      security:
        - internalApiKey: []
      responses:
        '200':
          description: Notifications sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NotificationResult'
        '401':
          description: Invalid or missing API key

  /api/internal/cleanup-images:
    post:
      tags:
        - Internal
      summary: Clean up orphaned images
      description: |
        Deletes tracked image files from storage, plus their metadata rows, once nothing references them
        any more. Designed to be called by Cloud Scheduler (once daily). Requires `X-Internal-Api-Key`.

        **An image counts as referenced** when its URL appears in any of:
        - `mystery_boxes.image_url` — a box's custom cover
        - `box_templates.image_url` — a template's custom cover
        - `merchant_profiles.logo_url` — the store logo
        - `merchant_profiles.photo_urls` — the store photo gallery (a JSON array)
        - `stock_photos.image_url` — a curated stock photo

        Missing a reference site here is destructive and irreversible, so two rails apply:
        - **Age threshold** (`imageCleanup.minAgeDays`, default 7 days). A metadata row is written when the
          presigned upload URL is *issued*, not when the upload completes or the merchant saves — so
          recent rows may still belong to an in-flight upload and are skipped.
        - **Per-run cap** (`imageCleanup.maxDeletionsPerRun`, default 50). When more orphans are eligible
          than the cap allows, `capped` is true and a warning is logged. A persistently capped run is a
          signal that a reference site may be missing.

        Run with `dryRun=true` first after any change to the reference sites: nothing is deleted, and the
        response plus the logs report exactly what would have gone.
      security:
        - internalApiKey: []
      parameters:
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, report what would be deleted without deleting anything. `deletedCount` is 0 and
            `candidates` reports the eligible orphans.
      responses:
        '200':
          description: Cleanup complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ImageCleanupResult'
        '401':
          description: Invalid or missing API key
        '403':
          description: INTERNAL_API_KEY is not configured on the server

  /api/app/version-requirements:
    get:
      tags:
        - App
      summary: Get per-platform app version requirements
      description: |
        Public (unauthenticated) — clients must gate before login. Returns the forced-update floor per
        platform: `minSupported` (hard floor; a client below it must update) and optional `latest`
        (newest published version, for a soft "update available" nudge). Both `android` and `ios`
        keys are always present.
      responses:
        '200':
          description: Version requirements returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AppVersionRequirementsResponse'

  /api/admin/app/version-requirements:
    put:
      tags:
        - Admin App
      summary: Update per-platform app version requirements (admin)
      description: |
        Upserts the version requirements for both platforms and sets `updated_at`; the next public GET
        reflects the change immediately. Requires an admin token — a user/merchant token is rejected
        with 401. Version strings must be dotted-numeric (e.g. `1.2.0`); when `latest` is provided it
        must be `>= minSupported` (component-wise numeric compare). Invalid input yields a 400.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppVersionRequirementsRequest'
      responses:
        '200':
          description: Requirements updated; returns the new per-platform values
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AppVersionRequirementsResponse'
        '400':
          description: Invalid version format or latest < minSupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required

  /api/admin/settings/recommendation-threshold:
    get:
      tags:
        - Admin Settings
      summary: Read the 敲碗 vote threshold (admin)
      description: |
        Returns the vote count at which a store recommendation fires its Discord alert, plus whether
        that value is the built-in default (no override stored). Requires an admin token — a user or
        merchant token is rejected with 401.

        There is deliberately **no consumer counterpart** to this endpoint. Exposing the threshold to
        the app would amount to promising merchant outreach once a store reaches it, and the fallout
        when a store declines is worse than never having promised.
      security:
        - adminAuth: []
      responses:
        '200':
          description: The effective threshold
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RecommendationThresholdResponse'
        '401':
          description: Admin authentication required
    put:
      tags:
        - Admin Settings
      summary: Set the 敲碗 vote threshold (admin)
      description: |
        Stores an override, effective immediately for subsequent votes — no redeploy needed.

        Changes are **not retroactive in either direction**. Raising the threshold does not roll back
        alerts that already fired; lowering it does not back-fill alerts for recommendations that
        already exceed the new value. Those are re-evaluated only on their next incoming vote, and
        there is no batch sweep.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecommendationThresholdRequest'
      responses:
        '200':
          description: Threshold updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RecommendationThresholdResponse'
        '400':
          description: Threshold is not a positive integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Admin authentication required

  /api/admin/login:
    post:
      tags:
        - Admin Auth
      summary: Admin login
      description: |
        Exchanges admin credentials for a JWT pair. The access token carries `type: "admin"` and is the
        only kind accepted by the `/api/admin/**` endpoints — a user or merchant token is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: More than 10 requests a minute from this client IP — RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/admin/refresh:
    post:
      tags:
        - Admin Auth
      summary: Refresh admin token
      requestBody:
        required: true
        content:
          application/json:
            schema:
