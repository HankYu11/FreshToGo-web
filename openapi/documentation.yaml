          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Box UUID
      responses:
        '200':
          description: Box found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/MysteryBoxResponse'
        '404':
          description: Box not found
          content:
            application/json:
