      summary: Update display name
      description: Updates the authenticated user's display name (2–20 characters).
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - displayName
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 20
                  example: "FoodLover"
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Display name out of range or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/user/images/presigned:
    get:
      tags:
        - User
      summary: Get presigned upload URL
      description: Returns a Supabase presigned upload URL and the resulting public URL. The client uploads the image directly to Supabase using the signedUrl, then calls PUT /api/user/avatar with the publicUrl.
      security:
        - userAuth: []
      parameters:
        - name: contentType
          in: query
          required: false
          schema:
            type: string
            example: image/jpeg
          description: MIME type of the image to upload (image/jpeg, image/png, or image/webp)
      responses:
        '200':
          description: Presigned URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          description: Unsupported content type or Supabase not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/user/avatar:
    put:
      tags:
        - User
      summary: Update avatar URL
      description: Persists the Supabase public URL as the user's pictureUrl. Call this after a successful direct upload via the presigned URL.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pictureUrl
              properties:
                pictureUrl:
                  type: string
                  description: Public Supabase URL of the uploaded avatar image
                  example: https://example.supabase.co/storage/v1/object/public/bucket/uuid.jpg
      responses:
        '200':
          description: pictureUrl updated; returns updated user record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing or malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==================== USER NOTIFICATION ROUTES ====================
  /api/user/notifications/token:
    post:
      tags:
        - Notifications
      summary: Register user FCM token
      description: |
        Registers or updates an FCM token for push notifications.
        If the token already exists, it updates the timestamp.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
      responses:
        '200':
          description: Token registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FcmTokenRegisterResponse'
        '400':
          description: Invalid token format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                error:
                  code: "FCM_TOKEN_INVALID"
                  message: "The FCM token format is invalid"
        '401':
          description: Invalid or expired authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    delete:
      tags:
        - Notifications
      summary: Unregister user FCM tokens
      description: |
        Removes all FCM tokens associated with the user.
        Use this endpoint on logout to stop receiving push notifications.
        This operation is idempotent - returns success even if no tokens existed.
      security:
        - userAuth: []
      responses:
        '200':
          description: Tokens unregistered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FcmTokenUnregisterResponse'
        '401':
          description: Invalid or expired authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/user/notification-preferences:
    get:
      tags:
        - Notifications
      summary: Get notification preferences
      description: |
        Returns the authenticated consumer's notification preference settings.
        If no preferences have been set, returns defaults with all three flags set to `true`.
      security:
        - userAuth: []
      responses:
        '200':
          description: Preferences returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          description: Invalid or expired authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    put:
      tags:
        - Notifications
      summary: Update notification preferences
      description: |
        Updates the authenticated consumer's notification preference settings.
        Only the fields present in the request body are updated; omitted fields retain their current value.
        At least one field must be provided — an all-null body returns 400.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Preferences updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          description: No preference fields provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                error:
                  code: "BAD_REQUEST"
                  message: "At least one preference field must be provided"
        '401':
          description: Invalid or expired authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

