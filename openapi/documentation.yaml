                    $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          description: Admin authentication required

  /api/admin/analytics/timeseries:
    get:
      tags:
        - Admin Analytics
      summary: Daily time series for one metric
      description: |
        One data point per day between `dateFrom` and `dateTo` inclusive. Both default to the last
        30 days, resolved against Asia/Taipei rather than the server's UTC clock.
      security:
